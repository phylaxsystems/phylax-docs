name: Import Credible Std Assertion Examples

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the pinned import without creating a PR"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Read reviewed source revision
        id: source
        run: node -e 'const m = require("./.github/credible-std-import.json"); console.log(`revision=${m.revision}`)' >> "$GITHUB_OUTPUT"
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          repository: phylaxsystems/credible-std
          ref: ${{ steps.source.outputs.revision }}
          path: .import-source
          persist-credentials: false
      - name: Import and verify
        run: |
          node scripts/import-credible-std.mjs --source .import-source
          node scripts/import-credible-std.mjs --source .import-source --check
          git diff --check
      - name: Show diff
        run: git diff -- snippets .github/credible-std-import.json
      - name: Create pull request
        if: inputs.dry_run == false
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          add-paths: |
            snippets/*.mdx
            .github/credible-std-import.json
          commit-message: 'docs: refresh pinned assertion examples'
          title: 'docs: refresh pinned assertion examples'
          body: |
            Regenerated assertion snippets from the reviewed commit in
            `.github/credible-std-import.json`. Review dependent prose and example
            test results alongside any source-pin change; an import is not proof
            that every example passes.
          branch: update-credible-std-examples
          delete-branch: true
          base: main
